[project]
name = "data-structures-python"
version = "0.1.0"
description = "대학 컴공 학부 수준 자료구조 연습용 Python 구현체"
readme = "README.md"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q"